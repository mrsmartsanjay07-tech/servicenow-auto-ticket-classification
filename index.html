<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Ticket Classification - Flow Simulator</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#dde3ec;--ac:#0b6e4f;--ok:#0b7a3e;--no:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0e141b;--card:#161e28;--tx:#e8edf3;--mu:#98a2b3;--bd:#2a3644;--ac:#3ecf8e;--ok:#3ecf8e;--no:#f97066}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:14px;max-width:760px;margin:auto}
h1{font-size:20px;margin:6px 0}h2{font-size:15px;margin:0 0 10px}p.s{color:var(--mu);font-size:13px;margin:0 0 14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{font-size:12px;color:var(--mu);display:block;margin:8px 0 4px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
button{margin-top:12px;padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;font-size:14px}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-left:6px}
.tr{font-family:ui-monospace,monospace;font-size:12px;color:var(--mu);margin-top:10px;white-space:pre-wrap}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}
</style>
</head>
<body>
<h1>Auto Ticket Classification</h1>
<p class="s">Simulates a ServiceNow Flow Designer flow: Incident Created, check category or keywords, set Assignment Group.</p>

<div class="c">
<h2>1. Create Incident</h2>
<label>Short description</label><input id="sd" placeholder="e.g. WiFi not connecting">
<label>Category</label>
<select id="cat"><option value="">(blank)</option><option>Hardware</option><option>Software</option><option>Network</option><option>Inquiry / Help</option></select>
<button onclick="addInc()">Submit incident</button>
<div class="tr" id="trace"></div>
</div>

<div class="c">
<h2>2. Incidents</h2>
<div class="w"><table><thead><tr><th>Number</th><th>Short description</th><th>Category</th><th>Assignment group</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>

<div class="c">
<h2>3. Test cases</h2>
<button onclick="runTests()">Run all 6 tests</button><button class="g" onclick="document.getElementById('tt').innerHTML=''">Clear</button>
<div class="w"><table><thead><tr><th>#</th><th>Description</th><th>Expected</th><th>Got</th><th></th></tr></thead><tbody id="tt"></tbody></table></div>
</div>

<script>
const RULES=[
 {cat:'Hardware',group:'Hardware Support',kw:['laptop','keyboard','screen','mouse']},
 {cat:'Software',group:'Software Support',kw:['install','software','app','license']},
 {cat:'Network',group:'Network Support',kw:['wifi','vpn','network','internet']}
];
const FALLBACK='Service Desk';
let n=1000;const incs=[];
function classify(sd,cat){
 const t=['Trigger: Incident created'];const s=sd.toLowerCase();
 let r=RULES.find(x=>x.cat===cat);
 if(r){t.push('If Category = '+cat+' -> match');}
 else{
  t.push(cat?'Category "'+cat+'" has no rule, checking keywords':'Category blank, checking keywords');
  r=RULES.find(x=>x.kw.some(k=>s.includes(k)));
  if(r)t.push('Keyword match in short description -> '+r.cat);
 }
 if(r){t.push('Update Record: Category = '+r.cat+', Assignment group = '+r.group);return{category:r.cat,group:r.group,trace:t};}
 t.push('No match -> Assignment group = '+FALLBACK+', work note: manual triage needed');
 return{category:cat,group:FALLBACK,trace:t};
}
function addInc(){
 const sd=document.getElementById('sd').value.trim(),cat=document.getElementById('cat').value;
 if(!sd){alert('Enter a short description');return}
 const r=classify(sd,cat);incs.unshift({no:'INC'+String(++n).padStart(7,'0'),sd,category:r.category||'-',group:r.group});
 document.getElementById('trace').textContent=r.trace.join('\n');
 document.getElementById('rows').innerHTML=incs.map(i=>`<tr><td>${i.no}</td><td>${esc(i.sd)}</td><td>${i.category}</td><td>${i.group}</td></tr>`).join('');
 document.getElementById('sd').value='';
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const TESTS=[
 ['Laptop not working','Hardware','Hardware Support'],
 ['Software installation problem','Software','Software Support'],
 ['WiFi connection problem','Network','Network Support'],
 ['WiFi not connecting','','Network Support'],
 ['Keyboard keys stuck','','Hardware Support'],
 ['Random issue','','Service Desk']
];
function runTests(){
 document.getElementById('tt').innerHTML=TESTS.map((t,i)=>{
  const g=classify(t[0],t[1]).group,p=g===t[2];
  return `<tr><td>${i+1}</td><td>${t[0]}${t[1]?' ['+t[1]+']':' [blank]'}</td><td>${t[2]}</td><td>${g}</td><td class="${p?'ok':'no'}">${p?'PASS':'FAIL'}</td></tr>`}).join('');
}
</script>
</body>
</html>
